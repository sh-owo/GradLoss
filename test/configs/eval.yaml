defaults:
  - model: resnet18
  - dataset: cub
  - trainer: default
  - _self_

run_dir: null

samples: 50
faithfulness_steps: 6
ema_span: 20

hydra:
  run:
    dir: runs/eval/${model.name}/${dataset.name}/${now:%Y-%m-%d_%H-%M-%S}
  output_subdir: .hydra
  job:
    chdir: true
  job_logging:
    root:
      handlers: [console]
